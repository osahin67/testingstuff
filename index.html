<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sengoku Duel — Samurai Fighter</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #0b0b0d; color: #eee;
    font-family: 'Courier New', monospace; overflow: hidden;
  }
  #wrap { display: flex; flex-direction: column; align-items: center; padding: 12px; }
  canvas { background: #1a1410; border: 2px solid #3a2a1c; image-rendering: pixelated; }
  #hud { width: 1024px; display: flex; justify-content: space-between; font-size: 13px;
         color: #c9b58a; padding: 4px 0; }
  .key { color: #f4c062; }
  #menu { width: 1024px; padding: 8px; font-size: 13px; color: #c9b58a;
          display: flex; gap: 24px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>SENGOKU DUEL — Best of 3</span>
    <span><span class="key">F1</span> debug · <span class="key">F2</span> AI on/off · <span class="key">F5</span> reset · <span class="key">1-4</span> P1 char · <span class="key">5-8</span> P2 char</span>
  </div>
  <canvas id="game" width="1024" height="576"></canvas>
  <div id="menu">
    <span>P1: <span class="key">A/D</span> walk · <span class="key">S</span> crouch · <span class="key">W</span> jump · <span class="key">Shift</span> dash · <span class="key">J</span> light · <span class="key">K</span> medium · <span class="key">L</span> heavy</span>
    <span>P2: <span class="key">←/→</span> walk · <span class="key">↓</span> crouch · <span class="key">↑</span> jump · <span class="key">/</span> dash · <span class="key">1</span> light · <span class="key">2</span> medium · <span class="key">3</span> heavy (numpad)</span>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
